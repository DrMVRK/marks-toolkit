[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marks-toolkit"
version = "0.1.0"
description = "Reusable application components and utilities."
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0",
    "Flask-Login>=0.6",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "redis>=5.0",
    "SQLAlchemy>=2.0",
    "email-validator>=2.0",
    "cryptography>=50.0",
    "pyotp>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]